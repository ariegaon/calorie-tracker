name: iOS TestFlight

# Builds the iOS shell (Capacitor), signs it with the App Store Connect API key and uploads it to TestFlight.
# The web app itself is served from Vercel, so this only needs to run when the shell changes (or by manual dispatch).
#
# Repository secrets required (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID     the 10-character Team ID of the Apple Developer account
#   ASC_KEY_ID        Key ID of the App Store Connect API key
#   ASC_ISSUER_ID     Issuer ID shown above the list of API keys
#   ASC_PRIVATE_KEY   full text of the downloaded .p8 file, including the BEGIN and END lines
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ios.yml"
      - "scripts/prepare-ios.mjs"

permissions:
  contents: write

concurrency:
  group: ios-testflight
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: secrets
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          missing=""
          [ -n "$APPLE_TEAM_ID" ] || missing="$missing APPLE_TEAM_ID"
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_PRIVATE_KEY" ] || missing="$missing ASC_PRIVATE_KEY"
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing" | tee "$RUNNER_TEMP/build.log"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Write API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Build and upload
        id: build
        run: |
          set -o pipefail
          KEY="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          {
            xcodebuild -version
            npm install --no-audit --no-fund
            npx cap add ios
            node scripts/prepare-ios.mjs
            npx cap sync ios
            cd ios/App
            ls
            if [ -d App.xcworkspace ]; then CONTAINER=(-workspace App.xcworkspace); else CONTAINER=(-project App.xcodeproj); fi

            xcodebuild "${CONTAINER[@]}" -scheme App -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/App.xcarchive" \
              "${AUTH[@]}" archive

            cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST

            xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/App.xcarchive" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
              -exportPath "$RUNNER_TEMP/export" \
              "${AUTH[@]}"
          } 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Remove API key
        if: always()
        run: rm -rf "$HOME/private_keys"

      # The build log is kept on a branch so a failed build can be diagnosed without opening Actions.
      - name: Save build log
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          cd "$RUNNER_TEMP/logs"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            echo "run: ${{ github.run_number }}"
            echo "commit: ${{ github.sha }}"
            echo "missing secrets:${{ steps.secrets.outputs.missing }}"
            echo "build: ${{ steps.build.outcome }}"
            echo "job: ${{ job.status }}"
            date -u +"time: %Y-%m-%dT%H:%M:%SZ"
          } > status.txt
          if [ -f "$RUNNER_TEMP/build.log" ]; then
            grep -n -E "error:|Error:|\*\* .* FAILED|No profiles|requires a provisioning|Upload succeeded|EXPORT SUCCEEDED|ARCHIVE SUCCEEDED" "$RUNNER_TEMP/build.log" | head -n 80 > errors.txt || true
            tail -n 300 "$RUNNER_TEMP/build.log" > ios-build.log
          else
            echo "no build log" > ios-build.log
          fi
          git add -A
          git commit -q -m "iOS build log for run ${{ github.run_number }}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:ci-logs-ios
